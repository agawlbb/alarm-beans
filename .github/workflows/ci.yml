# SPDX-License-Identifier: MPL-2.0
name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home-assistant:
    uses: ./.github/workflows/home-assistant.yml
  apple-build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select and verify Xcode 27.2 and Apple SDKs
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          [[ "$(xcodebuild -version)" == $'Xcode 27.2\nBuild version 27B52' ]]
          for sdk in iphoneos iphonesimulator watchos watchsimulator; do
            version="$(xcrun --sdk "$sdk" --show-sdk-version)"
            echo "$sdk SDK: $version"
            [[ "$version" == 27.2 ]] || { echo "::error::Expected $sdk SDK 27.2"; exit 1; }
          done
      - name: Build iPhone, Watch, complication, and test coordination
        run: bash scripts/ci.sh
      - name: Save generated project and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: alarm-beans-build-diagnostics
          path: |
            AlarmBeans.xcodeproj
            build/DerivedData/Logs
            build/WatchDerivedData/Logs
            build/DeviceDerivedData/Logs
          if-no-files-found: ignore

