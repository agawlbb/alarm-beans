# SPDX-License-Identifier: MPL-2.0
name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install pinned Home Assistant framework
        run: python -m pip install 'homeassistant==2026.10.0' 'segno==1.6.6'
      - name: Test protocol and actual Home Assistant entity contracts
        run: python -m unittest discover -s HomeAssistant/tests -v
  apple-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build iPhone, Watch, complication, and test coordination
        run: bash scripts/ci.sh
      - name: Save generated project and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: alarm-beans-build-diagnostics
          path: |
            AlarmBeans.xcodeproj
            build/DerivedData/Logs
            build/WatchDerivedData/Logs
            build/DeviceDerivedData/Logs
          if-no-files-found: ignore

